# ──────────────────────────────────────────────────────────────
#  GX-Arc · Nginx reverse proxy
#  File: /etc/nginx/sites-available/gx-arc
#
#  Single VPS — serves frontend + proxies API.
#  Domains listed ONLY here — swap when you move to a permanent domain.
# ──────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pocketsarthi.com www.pocketsarthi.com pocketsarthi.co.in www.pocketsarthi.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pocketsarthi.com www.pocketsarthi.com pocketsarthi.co.in www.pocketsarthi.co.in;

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/pocketsarthi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocketsarthi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve frontend static files directly via Nginx (fast)
    root /var/www/gx-arc/frontend;
    index index.html;

    # Static assets — long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → Node backend
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
